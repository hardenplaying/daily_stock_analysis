name: 每日股票分析

on:
  # 定时：工作日北京时间 17:00（UTC 09:00，周一至周五）
  schedule:
    - cron: '0 09 * * 1-5'
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full          # 完整分析（股票+大盘）
          - market-only   # 仅大盘复盘
          - stocks-only   # 仅股票分析
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean

# 同一时间只跑一个分析任务
concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: mkdir -p data logs reports

      - name: 执行股票分析
        env:
          # ===== AI 模型：DeepSeek =====
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # ===== 飞书群机器人 =====
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          # ===== 固定自选股（热门股关闭/失败时回退；在 Settings→Variables 配置，可留空）=====
          STOCK_LIST_CONFIG: ${{ vars.STOCK_LIST }}
          # ===== 热门人气股开关（留空=关闭；eastmoney=人气榜，eastmoney_up=飙升榜）=====
          HOT_STOCK_SOURCE: ${{ vars.HOT_STOCK_SOURCE }}
          HOT_STOCK_TOP: ${{ vars.HOT_STOCK_TOP || '10' }}
          # ===== 并发数固定 3，避免串行撞超时 =====
          MAX_WORKERS: 3
        run: |
          set -e

          # 1) 热门人气股模式：自动抓取当天热榜
          if [ -n "${HOT_STOCK_SOURCE:-}" ]; then
            echo "🔥 热门人气股模式：数据源=$HOT_STOCK_SOURCE，数量=$HOT_STOCK_TOP"
            HOT_CODES="$(python scripts/fetch_hot_stocks.py --source "$HOT_STOCK_SOURCE" --top "$HOT_STOCK_TOP" || true)"
            if [ -n "$HOT_CODES" ]; then
              export STOCK_LIST="$HOT_CODES"
              echo "✅ 已自动获取当天热门股：$STOCK_LIST"
            else
              echo "⚠️ 热门股抓取失败，回退到固定自选股列表"
            fi
          fi

          # 2) 回退：固定自选股 → 最小默认值
          if [ -z "${STOCK_LIST:-}" ]; then
            if [ -n "${STOCK_LIST_CONFIG:-}" ]; then
              export STOCK_LIST="$STOCK_LIST_CONFIG"
            else
              export STOCK_LIST="600519"
            fi
          fi
          echo "📊 本次分析列表：$STOCK_LIST"

          # 3) 运行模式与强制开关
          MODE="${{ github.event.inputs.mode || 'full' }}"
          FORCE_RUN_ARG=""
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            FORCE_RUN_ARG="--force-run"
          fi

          # 4) 执行分析（股票列表经 STOCK_LIST 环境变量传入）
          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review $FORCE_RUN_ARG
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review $FORCE_RUN_ARG
          else
            python main.py $FORCE_RUN_ARG
          fi

      - name: 上传分析报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30
